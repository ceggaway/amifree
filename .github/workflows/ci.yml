name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      # The SQL engine lets the database integration test run instead of being skipped.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/sql-tests/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install -c constraints.txt -r requirements.txt
          python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Install SQL test engine
        run: npm --prefix scripts/sql-tests ci --ignore-scripts --no-audit --no-fund
      - name: Syntax, lint, format, dependencies
        run: |
          python -m compileall -q app scripts tests
          ruff check .
          ruff format --check .
          python -m pip check
      - name: Backend smoke test
        run: python scripts/smoke_backend.py
      - name: Tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing
      - name: PostgreSQL schema and migrations
        run: npm --prefix scripts/sql-tests test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web test
      - run: npm --prefix web run build
